# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Home Assistant is the test pin, not the supported minimum (that is the
      # homeassistant key in hacs.json, set by the Python version aula requires).
      # Bump it by hand together with the test plugin below.
      - dependency-name: "homeassistant"
      # The test plugin pins Home Assistant exactly; update the pair together.
      - dependency-name: "pytest-homeassistant-custom-component"
